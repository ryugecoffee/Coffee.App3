    <meta
      name="description"
      content="A quiet personality test that compares you to one of 16 coffee varieties."
    />

    <meta property="og:title" content="Coffee Variety Test" />
    <meta
      property="og:description"
      content="What coffee variety are you?"
    />
    <meta property="og:type" content="website" />

    <script>
      const GA_ID = "%VITE_GA_MEASUREMENT_ID%";

      if (GA_ID && !GA_ID.includes("VITE_GA_MEASUREMENT_ID")) {
        const script = document.createElement("script");
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;

        gtag("js", new Date());
        gtag("config", GA_ID, {
          send_page_view: false
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
